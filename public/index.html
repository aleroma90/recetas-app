<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas IA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🍳 Recetas IA</h1>

    <form id="form">
      <label for="consulta">¿Qué querés cocinar?</label>
      <div class="input-row">
        <textarea id="consulta" placeholder="Ej: tengo pollo y arroz, quiero algo rápido para cenar con mis hijos" required></textarea>
        <button type="button" id="micBtn" title="Dictar por voz" aria-label="Dictar por voz">🎤</button>
      </div>

      <button type="submit" id="submitBtn">Sugerir recetas</button>
    </form>

    <div id="estado"></div>
    <div id="resultado"></div>
    <button type="button" id="masBtn" style="display:none;">Ver más</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
